name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install ruff pytest

      # Fail only on genuine errors (undefined names, syntax, bad f-strings),
      # not style. Tighten the rule selection later as the codebase stabilises.
      - name: Ruff (error subset)
        run: ruff check . --select=E9,F63,F7,F82 --output-format=github

      # Compiles every .py file — catches syntax errors across the whole repo.
      - name: Compile check
        run: python -m pytest tests/test_smoke.py -q
